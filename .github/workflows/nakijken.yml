name: Weetjes nakijken
on:
  schedule: [{ cron: "17 6 1 * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  nakijken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -I scripts/nakijken.py
      - run: |
          git config user.name "weetjes-nakijken"; git config user.email "actions@users.noreply.github.com"
          git add site/data/weetjes.json data/nagekeken.json
          git diff --cached --quiet || git commit -m "Weetjes maandelijks nagekeken" && git push

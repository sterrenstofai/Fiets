[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/modellen/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[redirects]]
  from = "/kinderen"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/onderzoekjes/*"
  to = "/onderzoekjes.html"
  status = 200

[[redirects]]
  from = "/onderzoekjes"
  to = "/onderzoekjes.html"
  status = 200

[[redirects]]
  from = "/mijn"
  to = "/mijn.html"
  status = 200

[[redirects]]
  from = "/hoe-dit-werkt"
  to = "/hoe-dit-werkt.html"
  status = 200

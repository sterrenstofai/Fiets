<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De fiets</title>
<meta name="description" content="Een racefiets met motor in 3D: draai hem rond, haal hem uit elkaar en bouw hem stap voor stap in elkaar.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="/js/vendor/three.core.min.js">
<link rel="modulepreload" href="/js/vendor/three.module.min.js">
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="/css/stijl.css">
</head>
<body>
<main class="app">
  <section class="podium" aria-label="De fiets in 3D">
    <canvas id="doek" aria-label="Een getekende racefiets met motor. Sleep om te draaien."></canvas>
    <svg id="lijntjes" class="lijntjes" aria-hidden="true"></svg>
    <div id="namen" class="namen" aria-hidden="true"></div>
    <div class="stand" role="group" aria-label="Weergave">
      <button type="button" data-stand="tekening" aria-pressed="true"><i></i>Tekening</button>
      <button type="button" data-stand="echt" aria-pressed="false"><i class="donker"></i>Donker</button>
    </div>
    <button type="button" id="uiteenknop" class="uiteenknop" aria-pressed="false"><svg viewBox="0 0 20 14" aria-hidden="true"><path d="M2 7h4M14 7h4M10 1v3M10 10v3M7 4l-2-2M13 4l2-2M7 10l-2 2M13 10l2 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Uit elkaar <kbd>E</kbd></button>
    <div id="stapnummer" class="stapnummer" hidden><span id="stapgetal">1</span><span id="stapicoon" class="stapicoon"></span></div>
    <div id="speler" class="speler" hidden>
      <button type="button" id="opnieuw" aria-label="Opnieuw afspelen">↺</button>
      <button type="button" id="pauze" aria-label="Pauze">❚❚</button>
      <button type="button" id="traag" aria-pressed="false">Traag</button>
    </div>
    <p id="hint" class="hint mono">Sleep om te draaien · tik op de lampen</p>
    <svg id="minifiets" class="minifiets" viewBox="0 0 120 70" aria-hidden="true"></svg>
    <p id="minitekst" class="minitekst mono">Maat ML · sleep om te draaien</p>
  </section>
  <aside class="paneel">
    <header class="paneelkop">
      <p class="model mono">E-racefiets ML</p>
      <div class="kopknoppen">
        <button type="button" id="tour" class="klein" aria-pressed="false">▸ Tour</button>
        <button type="button" id="geluid" class="klein" aria-pressed="true">Geluid</button>
        <button type="button" id="stem" class="klein zwart" aria-pressed="false">● Stem</button>
      </div>
    </header>
    <nav class="tabs mono" role="tablist">
      <button type="button" role="tab" data-tab="anatomie" aria-selected="true">Anatomie</button>
      <button type="button" role="tab" data-tab="bouwen" aria-selected="false">Bouwen <span id="teller" class="zacht">0/9</span></button>
      <button type="button" role="tab" data-tab="klaar" aria-selected="false">Klaar</button>
    </nav>
    <ol id="lijst" class="lijst mono"></ol>
    <div id="inhoud" class="inhoud"></div>
    <footer class="onder">
      <div id="onderknoppen" class="onderknoppen"></div>
      <p id="toetsen" class="toetsen mono"></p>
    </footer>
  </aside>
</main>
<p class="voet mono"><span class="label-tekening">tekening</span> zelf getekend, geen bestaande fiets · maten van de tekening · bouwen doe je samen met een volwassene · geen cookies · <a href="/hoe-dit-werkt">Hoe dit werkt</a></p>
<script type="module" src="/js/app.js"></script>
</body>
</html>
